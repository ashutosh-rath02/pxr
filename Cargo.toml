[workspace]
members = ["crates/runtime-core", "crates/runtime-codec", "crates/runtime-c-api", "crates/runtime-sim"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ashutosh-rath02/pxr"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"
