name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all --check
      - run: cargo +stable clippy --workspace --all-targets -- -D warnings
      - run: cargo +stable test --workspace --locked
      - run: cargo +stable build --workspace --release --locked
      - if: runner.os != 'Windows'
        run: python3 scripts/verify_cli.py target/release/pxr
      - if: runner.os == 'Windows'
        run: python scripts/verify_cli.py target/release/pxr.exe
      - if: runner.os == 'Linux'
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Iinclude examples/c-embedding/main.c target/release/libpxr_runtime_c_api.a -ldl -lpthread -lm -o target/c-embedding
          ./target/c-embedding
      - if: runner.os != 'Windows'
        run: ./target/release/pxr bench 20000 > benchmark.json
      - if: runner.os == 'Windows'
        run: ./target/release/pxr.exe bench 20000 > benchmark.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: host-${{ matrix.os }}
          path: |
            target/release/pxr
            target/release/pxr.exe
            benchmark.json
  embedded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup target add thumbv7em-none-eabihf riscv32imc-unknown-none-elf
      - run: cargo build --locked --release -p pxr-runtime-c-api --no-default-features --target thumbv7em-none-eabihf
      - run: cargo build --locked --release -p pxr-runtime-c-api --no-default-features --target riscv32imc-unknown-none-elf
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 test --workspace --locked
